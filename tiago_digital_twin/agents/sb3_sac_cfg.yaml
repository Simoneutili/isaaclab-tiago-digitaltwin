# SAC, https://stable-baselines3.readthedocs.io/en/master/modules/sac.html
policy: MlpPolicy
seed: 42
n_timesteps: 10000000.0
learning_rate: 0.0012791799721651705
batch_size: 256
buffer_size: 100000
gamma: 0.912983308291599
tau: 0.04744387257572842
ent_coef: 0.0021836766280786475
train_freq: 1
gradient_steps: 1
policy_kwargs: "dict(activation_fn=nn.ReLU, net_arch=[256, 256])"
normalize_input: true
normalize_value: true
clip_obs: 10.0
